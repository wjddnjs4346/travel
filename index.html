<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>여행 일정관리</title>
  <!-- 갤럭시가 아닌 기기용 대체 글꼴. 오프라인이면 불러오지 못해도 시스템 글꼴로 표시된다 (style.css의 --font-sans) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 안내는 토스트(role=status)가 소리 내어 알리므로 여기는 낭독 영역으로 두지 않는다 -->
  <div id="notices" class="notices"></div>
  <div id="app" class="app"></div>
  <noscript>JavaScript를 켜야 사용할 수 있습니다.</noscript>

  <!-- 바텀 시트와 확인 창은 #app 밖에 두어 화면을 다시 그려도 유지된다 -->
  <dialog id="modal" class="dialog sheet" aria-labelledby="modal-title"></dialog>
  <dialog id="confirm" class="dialog dialog--confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>

  <!-- file://에서도 동작하도록 ES 모듈 대신 일반 스크립트를 의존 순서대로 불러온다 -->
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/stats.js"></script>
  <!-- 지도(Leaflet)는 일정표 탭이나 위치 지정 창을 열 때 map.js가 인터넷에서 불러온다 -->
  <script src="js/map.js"></script>
  <script src="js/export.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
